name: Probar la consola y el giro en navegador
on:
  push:
    branches: ['verificar/consola-camara-20261119']
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: b750f17cc14a59e0ca41deedd439dbfe4ea11acc
          path: interfaz
          fetch-depth: 0
      - name: Identificar recursos idénticos al descomprimir
        working-directory: interfaz
        run: |
          python3 - <<'PY'
          import gzip, json, pathlib, subprocess
          base = 'b49c18392cd2adabdeb27534fef6c6740e66929d'
          paths = subprocess.check_output(['git','diff','--name-only','--diff-filter=M',base,'HEAD','--','c3/firmware/web/']).decode().splitlines()
          same = [p for p in paths if p.endswith('.gz') and gzip.decompress(pathlib.Path(p).read_bytes()) == gzip.decompress(subprocess.check_output(['git','show',base+':'+p]))]
          print('C3_SAME_BYTES='+json.dumps(same))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar herramientas de prueba en el directorio temporal
        run: |
          mkdir -p "$RUNNER_TEMP/c3qa"
          cp .github/prueba-navegador.cjs "$RUNNER_TEMP/c3qa/"
          cd "$RUNNER_TEMP/c3qa"
          npm install --no-audit --no-fund playwright-core@1.56.1 pngjs@7.0.0 ws@8.18.3
          ./node_modules/.bin/playwright-core install --with-deps webkit
      - name: Probar la web que sirve SPIFFS con mensajes y video simulados
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          export WEB_ROOT="$GITHUB_WORKSPACE/interfaz/c3/firmware/web"
          node "$RUNNER_TEMP/c3qa/prueba-navegador.cjs"
